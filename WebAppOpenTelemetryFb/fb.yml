pipeline:
  inputs:
    - name: opentelemetry
      listen: 127.0.0.1
      port: 4315
      # port: 4317
      # port: 4318

  outputs:
    - name: stdout
      match: '*'
    - name: opentelemetry
      match: '*'
      host: localhost
      port: 4318
      metrics_uri: /v1/metrics
      logs_uri: /v1/logs
      traces_uri: /v1/traces
      log_response_payload: true
      

